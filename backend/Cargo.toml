[package]
name = "princess_journey"
version = "1.0.0"
authors = ["Nicolas Pernoud <github@ninico.fr>"]
edition = "2024"

[dependencies]
actix-web = "4.15.0"
diesel = { version = "2.3.13", features = ["r2d2", "sqlite"] }
diesel_migrations = "2.3.2"
env_logger = "0.11.11"
r2d2 = "0.8.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
actix-cors = "0.7.2"
actix-files = "0.7.0"
actix-web-httpauth = "0.8.3"
rand = "0.10.3"
log = "0.4.34"

[dev-dependencies]
actix-rt = "2.15.0"
regex = "1.13.1"
